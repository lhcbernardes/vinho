name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift
        run: swift --version

      - name: Testes (inclui validação de community/)
        run: swift test

      - name: Build release do app
        run: swift build -c release --product Vinho
