name: Wine runtime (CrossOver)

# EXPERIMENTAL. Compila o Wine a partir do código-fonte que a CodeWeavers
# publica (LGPL) — o mesmo Wine do CrossOver, com os patches deles — e publica
# na release "runtimes" junto com `runtimes.json`. O Vinho lê esse catálogo
# (Catalog.communityURL) e mostra o runtime em Ajustes ▸ Runtimes.
#
# Rode em Actions ▸ "Wine runtime (CrossOver)" ▸ Run workflow, informando a
# versão (ex.: 26.3.0). Lista: https://www.codeweavers.com/crossover/source
#
# Dependências vêm do MacPorts (pacotes binários x86_64 prontos) e o
# compilador PE é o llvm-mingw — o mesmo esquema dos builds do Gcenx. O
# Homebrew não serve aqui: no Intel ele compila tudo do código-fonte (horas).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do CrossOver (ex.: 26.3.0)"
        required: true
        default: "26.3.0"
      revision:
        description: "Revisão do pacote (aumente para republicar a mesma versão)"
        required: false
        default: "1"

permissions:
  contents: write

env:
  CX_VERSION: ${{ inputs.version }}
  RUNTIME_ID: wine-cx-${{ inputs.version }}_${{ inputs.revision }}
  GH_TOKEN: ${{ github.token }}
  MACPORTS: bison pkgconfig gettext freetype gnutls libsdl2 moltenvk
  # Bibliotecas que o Wine abre com dlopen; vão junto em lib/ com as dependências.
  BUNDLED_LIBS: libfreetype.6.dylib libgnutls.30.dylib libSDL2-2.0.0.dylib libMoltenVK.dylib

jobs:
  build:
    # x86_64 nativo: o Wine roda sob Rosetta 2 nos Macs Apple Silicon.
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: MacPorts e dependências
        run: |
          gh release download -R macports/macports-base -p '*-15-Sequoia.pkg' -O macports.pkg
          sudo installer -pkg macports.pkg -target /
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          sudo port -N selfupdate
          sudo port -N install $MACPORTS
          port installed

      - name: llvm-mingw
        run: |
          gh release download -R mstorsjo/llvm-mingw -p '*-ucrt-macos-universal.tar.xz' -O llvm-mingw.tar.xz
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-clang" --version

      - name: Baixar o código-fonte da CodeWeavers
        run: |
          URL="https://media.codeweavers.com/pub/crossover/source/crossover-sources-${CX_VERSION}.tar.gz"
          if ! curl -fL --retry 3 -o cx.tar.gz "$URL"; then
            echo "::error::$URL não existe. Veja as versões em https://www.codeweavers.com/crossover/source"
            exit 1
          fi
          shasum -a 256 cx.tar.gz | tee cx.tar.gz.sha256
          mkdir -p cx && tar -xzf cx.tar.gz -C cx
          CONFIGURE="$(find cx -maxdepth 4 -path '*/wine/configure' | head -1)"
          test -n "$CONFIGURE" && test -x "$CONFIGURE"
          echo "WINE_SRC=$PWD/$(dirname "$CONFIGURE")" >> "$GITHUB_ENV"

      - name: Configurar
        run: |
          mkdir -p build && cd build
          export CC=clang CXX=clang++
          export CPATH=/opt/local/include
          export LIBRARY_PATH=/opt/local/lib
          export PKG_CONFIG=/opt/local/bin/pkg-config
          export PKG_CONFIG_PATH=/opt/local/lib/pkgconfig
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CROSSCFLAGS="-g -O2"
          export CFLAGS="-g -O2 -Wno-deprecated-declarations -Wno-incompatible-function-pointer-types -Wno-int-conversion"
          "$WINE_SRC/configure" \
            --prefix= \
            --build=x86_64-apple-darwin \
            --disable-tests \
            --enable-archs=i386,x86_64 \
            --with-mingw \
            --with-coreaudio --with-cups --with-freetype --with-gettext --with-gnutls \
            --with-opencl --with-opengl --with-pthread --with-sdl --with-unwind --with-vulkan \
            --without-alsa --without-capi --without-dbus --without-ffmpeg --without-fontconfig \
            --without-gettextpo --without-gphoto --without-gssapi --without-gstreamer \
            --without-inotify --without-krb5 --without-netapi --without-oss --without-pcap \
            --without-pcsclite --without-pulse --without-sane --without-udev --without-usb \
            --without-v4l2 --without-va --without-wayland --without-x \
            || { tail -100 config.log; exit 1; }

      - name: Compilar
        run: make -C build -j"$(sysctl -n hw.ncpu)"

      - name: Instalar e empacotar
        run: |
          export DEST="$PWD/out/$RUNTIME_ID"
          make -C build install-lib DESTDIR="$DEST"
          # Bibliotecas abertas por dlopen + tudo de que elas dependem
          # (o Vinho aponta DYLD_FALLBACK_LIBRARY_PATH para lib/).
          python3 - <<'PY'
          import os, shutil, subprocess
          dest = os.path.join(os.environ["DEST"], "lib"); src = "/opt/local/lib"
          todo, seen = os.environ["BUNDLED_LIBS"].split(), set()
          while todo:
              name = todo.pop()
              if name in seen: continue
              seen.add(name)
              path = os.path.realpath(os.path.join(src, name))
              if not os.path.exists(path):
                  raise SystemExit(f"falta {name}")
              shutil.copy2(path, os.path.join(dest, name))
              for line in subprocess.run(["otool", "-L", path], capture_output=True, text=True).stdout.splitlines()[1:]:
                  dep = line.strip().split(" ")[0]
                  if dep.startswith(src + "/"): todo.append(os.path.basename(dep))
          print("bibliotecas:", " ".join(sorted(seen)))
          PY
          touch "$DEST/VINHO_BUNDLED_LIBS"
          echo "$CX_VERSION" > "$DEST/VERSION"
          DYLD_FALLBACK_LIBRARY_PATH="$DEST/lib" "$DEST/bin/wine" --version || true
          tar -C out -cJf "$RUNTIME_ID-osx64.tar.xz" "$RUNTIME_ID"
          ls -lh "$RUNTIME_ID-osx64.tar.xz"

      - name: Atualizar runtimes.json
        env:
          REPO: ${{ github.repository }}
        run: |
          gh release view runtimes >/dev/null 2>&1 || \
            gh release create runtimes --prerelease --title "Runtimes Wine (experimental)" \
              --notes "Builds do Wine a partir do código-fonte do CrossOver (LGPL). Gerados pelo workflow wine-runtime."
          gh release download runtimes -p runtimes.json -O old.json 2>/dev/null || echo '{"schemaVersion":1,"runtimes":[],"components":[]}' > old.json
          python3 - <<'PY'
          import hashlib, json, os
          rid = os.environ["RUNTIME_ID"]; ver = os.environ["CX_VERSION"]; repo = os.environ["REPO"]
          name = f"{rid}-osx64.tar.xz"
          data = open(name, "rb").read()
          catalog = json.load(open("old.json"))
          entry = {
              "id": rid, "name": "Wine CrossOver", "version": ver, "channel": "crossover",
              "artifact": {
                  "url": f"https://github.com/{repo}/releases/download/runtimes/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(), "size": len(data),
              },
              "notes": "Experimental: Wine com os patches da CodeWeavers, compilado do código-fonte do CrossOver.",
          }
          catalog["runtimes"] = [r for r in catalog.get("runtimes", []) if r["id"] != rid] + [entry]
          catalog.setdefault("components", [])
          catalog.setdefault("schemaVersion", 1)
          json.dump(catalog, open("runtimes.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(entry, indent=2))
          PY
          gh release upload runtimes "$RUNTIME_ID-osx64.tar.xz" runtimes.json --clobber
