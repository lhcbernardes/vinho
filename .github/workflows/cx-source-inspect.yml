name: Inspecionar código do CrossOver

# Diagnóstico: baixa o código-fonte da CodeWeavers e gera um relatório com grep
# e arquivos inteiros, publicado na release "diag" (cx-report.txt).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do CrossOver"
        default: "26.3.0"
        required: true
      pattern:
        description: "Expressão para o grep -E (no diretório do Wine)"
        default: 'CX_ROOT|CX_BOTTLE|"crossover"|cxmenu|cxassoc|CROSSOVER'
        required: true
      files:
        description: "Arquivos para imprimir inteiros (separados por espaço, relativos ao Wine)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PATTERN: ${{ inputs.pattern }}
      FILES: ${{ inputs.files }}
    steps:
      - name: Relatório
        run: |
          curl -fsL --retry 3 -o cx.tar.gz "https://media.codeweavers.com/pub/crossover/source/crossover-sources-${{ inputs.version }}.tar.gz"
          mkdir cx && tar -xzf cx.tar.gz -C cx
          WINE="$(dirname "$(find cx -maxdepth 4 -path '*/wine/configure' | head -1)")"
          OUT="$PWD/cx-report.txt"
          {
            echo "== estrutura"; find cx -maxdepth 2 | sort
            cd "$WINE"
            echo "== ocorrências: $PATTERN"
            grep -rnE --include='*.c' --include='*.h' --include='*.in' --include='*.ac' --include='*.inf' --include='*.sh' --include='*.rc' -- "$PATTERN" . | cut -c1-400 | head -2000
            for f in $FILES; do echo "======== $f"; cat -n "$f"; done
          } > "$OUT" 2>&1 || true
          wc -l "$OUT"
          gh release view diag >/dev/null 2>&1 || gh release create diag --prerelease --title "Diagnóstico" --notes "Relatórios gerados pelo workflow cx-source-inspect."
          gh release upload diag "$OUT" --clobber
