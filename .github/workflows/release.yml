name: Release

# Ao enviar uma tag v*, gera o Vinho.app universal e anexa ao release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testes
        run: swift test

      - name: cabextract (embutido no app)
        run: brew install cabextract

      - name: Bundle
        run: scripts/bundle.sh

      - name: Empacotar
        run: ditto -c -k --keepParent build/Vinho.app "Vinho-${GITHUB_REF_NAME}.zip"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Vinho-${GITHUB_REF_NAME}.zip" \
            --title "Vinho $GITHUB_REF_NAME" --generate-notes
