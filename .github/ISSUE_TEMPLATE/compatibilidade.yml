name: Relatório de compatibilidade
description: Conte como um app ou jogo rodou no Vinho (o app gera isto pelo menu "Funcionou?").
title: "[compat] "
labels: [compatibilidade]
body:
  - type: input
    id: programa
    attributes:
      label: Programa
      placeholder: Steam, Notepad++, Hollow Knight…
    validations:
      required: true
  - type: dropdown
    id: avaliacao
    attributes:
      label: Avaliação
      options:
        - 🟢 Perfeito
        - 🟡 Funciona
        - 🟠 Com problemas
        - 🔴 Não funciona
    validations:
      required: true
  - type: input
    id: receita
    attributes:
      label: Receita usada (id)
      placeholder: steam
  - type: input
    id: runtime
    attributes:
      label: Runtime e backend gráfico
      placeholder: wine-stable-11.0_1+dxmt-v0.80 · DXMT
  - type: input
    id: sistema
    attributes:
      label: macOS e Mac
      placeholder: 26.1 · Apple M2 Pro
  - type: textarea
    id: observacoes
    attributes:
      label: Observações
      description: Desempenho, falhas, ajustes que ajudaram.
